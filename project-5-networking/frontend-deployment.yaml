# Deployment: runs 2 frontend Nginx pods
# Each pod mounts the frontend-config ConfigMap as its web root index.html
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: project-5
  labels:
    app: frontend
    project: project-5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        project: project-5
    spec:
      containers:
      - name: frontend
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        # Mount the ConfigMap into the nginx web root directory
        volumeMounts:
        - name: frontend-content
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
      volumes:
      # Reference the frontend-config ConfigMap as a volume
      - name: frontend-content
        configMap:
          name: frontend-config
---
# Service: ClusterIP exposes the frontend pods internally
# The Ingress Controller will route "/" traffic to this service
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: project-5
  labels:
    app: frontend
    project: project-5
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  # ClusterIP is intentional — Ingress handles all external traffic
  # We do NOT need NodePort here anymore
  type: ClusterIP
