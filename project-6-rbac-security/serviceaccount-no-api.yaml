# serviceaccount-no-api.yaml
#
# This ServiceAccount represents a workload that never needs to call the
# Kubernetes API - for example, a plain nginx web server or a static
# frontend pod, like the ones from Projects 1, 2, and 5.
#
# Setting automountServiceAccountToken: false here means any pod using
# this ServiceAccount will NOT receive an auto-mounted API token,
# closing the security gap we discovered in Step 2.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-api-access-sa
  namespace: project-6
automountServiceAccountToken: false
