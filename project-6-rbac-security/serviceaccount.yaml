# serviceaccount.yaml
#
# This ServiceAccount gives the pod-lister pod its own dedicated identity,
# separate from the namespace's "default" ServiceAccount.
#
# Why this matters: if we left this pod on "default" and later granted
# "default" permission to list pods, EVERY pod in the namespace would
# inherit that permission, even ones that never asked for it.
# A dedicated ServiceAccount means permissions stay scoped to exactly
# the workload that needs them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-lister-sa
  namespace: project-6
