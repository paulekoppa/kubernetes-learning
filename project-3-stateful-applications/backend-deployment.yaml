# backend-deployment.yaml
# Runs the Node.js backend API as a stateless Deployment.
# The backend is stateless because it holds no data itself -
# all persistence is delegated to MySQL.
# The application code is mounted from the backend-code ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: project-3
  labels:
    app: backend
spec:
  replicas: 2                   # 2 replicas - stateless so safe to scale
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # initContainer runs before the main container starts.
      # It installs the mysql2 npm package into a shared volume
      # so the main container has the dependency available.
      # This avoids needing a custom Docker image.
      initContainers:
        - name: npm-install
          image: node:18-alpine
          command:
            - sh
            - -c
            - |
              cp /src/app.js /app/app.js
              cd /app
              npm init -y
              npm install mysql2
          volumeMounts:
            - name: app-volume         # shared with main container
              mountPath: /app
            - name: source-code        # ConfigMap with app.js
              mountPath: /src

      containers:
        - name: backend
          image: node:18-alpine
          command: ["node", "/app/app.js"]
          ports:
            - containerPort: 3000
          env:
            # MySQL connection details passed as environment variables.
            # The host uses the per-pod DNS name from the Headless Service:
            #   mysql-0.mysql.project-3.svc.cluster.local
            # This always resolves to mysql-0 specifically, not load-balanced.
            - name: MYSQL_HOST
              value: "mysql-0.mysql.project-3.svc.cluster.local"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: "root"
            # Password pulled from the Secret - never hardcoded
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: MYSQL_DATABASE
              value: "appdb"
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: app-volume         # contains app.js + node_modules
              mountPath: /app
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

      volumes:
        # app-volume: ephemeral shared space between initContainer
        # and main container. initContainer writes app.js + node_modules,
        # main container reads and runs them.
        - name: app-volume
          emptyDir: {}

        # source-code: mounts app.js from the ConfigMap into the
        # initContainer so it can be copied to the shared volume.
        - name: source-code
          configMap:
            name: backend-code
