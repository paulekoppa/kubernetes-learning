# mysql-secret.yaml
# Stores the MySQL root password as a base64-encoded Secret.
# Pods reference this Secret by name instead of hardcoding passwords.
# NOTE: base64 is encoding, NOT encryption.
#       In production, use Vault or Sealed Secrets for true security.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret          # name pods will reference
  namespace: project-3
type: Opaque                  # generic key-value secret type
data:
  # To generate: echo -n 'your-password' | base64
  # "rootpassword" encoded in base64 = cm9vdHBhc3N3b3Jk
  root-password: cm9vdHBhc3N3b3Jk
