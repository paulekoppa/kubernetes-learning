# mysql-secret.yaml
# Holds all MySQL connection credentials as base64-encoded values.
# Pods reference individual keys rather than hardcoding values.
#
# To encode a value:  echo -n 'value' | base64
# To decode a value:  echo 'encoded' | base64 --decode
#
# IMPORTANT: base64 is encoding, NOT encryption.
# Never commit real production credentials to Git.
# In production use Sealed Secrets or HashiCorp Vault.
#
# Encoded values used here:
#   root-password : rootpassword  → cm9vdHBhc3N3b3Jk
#   app-username  : appuser       → YXBwdXNlcg==
#   app-password  : apppassword   → YXBwcGFzc3dvcmQ=
#   app-database  : appdb         → YXBwZGI=
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: project-3
type: Opaque
data:
  root-password: cm9vdHBhc3N3b3Jk   # rootpassword
  app-username:  YXBwdXNlcg==        # appuser
  app-password:  YXBwcGFzc3dvcmQ=   # apppassword
  app-database:  YXBwZGI=            # appdb
