# frontend-service.yaml
# NodePort Service exposes the frontend outside the cluster.
# NodePort 30080 is accessible from your host machine at:
#   http://<minikube-node-ip>:30080
# Inside the cluster, other pods can reach it on port 80.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: project-3
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend               # routes to pods with label app=frontend
  ports:
    - name: http
      port: 80                  # cluster-internal port
      targetPort: 80            # container port
      nodePort: 30080           # external port on every node
