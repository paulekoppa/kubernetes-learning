# frontend-deployment.yaml
# Runs Nginx as the frontend tier.
# Nginx serves the HTML UI and proxies /api/* to the backend.
# This pod is fully stateless - all content comes from ConfigMaps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: project-3
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            # Mount custom nginx.conf to override the default config
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf           # mount single file, not whole dir
            # Mount index.html into Nginx's default web root
            - name: nginx-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-config         # both files come from one ConfigMap
